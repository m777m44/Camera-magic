name: Publish Mahdi Camera APK

on:
  workflow_run:
    workflows: ["Mahdi Camera app validation"]
    types: [completed]
    branches: [main]
  # API-only handoff when an owner signs locally. Payload contains the PUBLIC APK, never a key.
  repository_dispatch:
    types: [mahdi-build-unsigned, mahdi-publish-signed]

permissions:
  contents: read

concurrency:
  group: mahdi-camera-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'repository_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Select persistent-key signing or public-APK handoff
        id: signing
        env:
          APK_KEYSTORE_B64: ${{ secrets.MAHDI_APP_KEYSTORE_B64 }}
        run: python -m camera_magic.app_release mode
      - name: Verify successful application tests on the exact current main commit
        if: steps.signing.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m camera_magic.app_release preflight
      - uses: actions/setup-java@v6.3.0
        if: steps.signing.outputs.mode != 'none'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        if: steps.signing.outputs.mode != 'none'
      - uses: gradle/actions/setup-gradle@v6.4.1
        if: steps.signing.outputs.mode != 'none'
        with:
          gradle-version: '8.11.1'
      - name: Rebuild the validated independent source, never a vendor APK
        if: steps.signing.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;36.0.0"
          export MAHDI_VERSION_CODE=$(git rev-list --count HEAD)
          gradle --no-daemon :camera-app:assembleRelease
      - name: Stage unsigned PUBLIC APK for owner-local signing
        if: steps.signing.outputs.mode == 'unsigned'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m camera_magic.app_release unsigned
      - name: Sign with the persistent owner-controlled private key
        if: steps.signing.outputs.mode == 'sign'
        env:
          APK_KEYSTORE_B64: ${{ secrets.MAHDI_APP_KEYSTORE_B64 }}
          MAHDI_STORE_PASSWORD: ${{ secrets.MAHDI_APP_STORE_PASSWORD }}
          MAHDI_KEY_PASSWORD: ${{ secrets.MAHDI_APP_KEY_PASSWORD }}
        run: python -m camera_magic.app_release sign
      - name: Verify locally signed PUBLIC APK against rebuilt source and pinned certificate
        if: steps.signing.outputs.mode == 'receive'
        run: python -m camera_magic.app_release receive
      - name: Upload complete draft and publish as Latest
        if: steps.signing.outputs.mode == 'sign' || steps.signing.outputs.mode == 'receive'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m camera_magic.app_release publish
      - name: Remove transient signing key
        if: always()
        shell: python
        run: |
          from pathlib import Path
          Path("work/keys/mahdi-app.jks").unlink(missing_ok=True)
