[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-magic-toolkit"
version = "0.2.0"
description = "Local, auditable APK rebranding tools and an original SDR pseudo-HDR reference pipeline"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]
license = "MIT"

[project.scripts]
camera-magic = "camera_magic.__main__:main"

[tool.setuptools]
packages = ["camera_magic"]

[tool.ruff]
line-length = 100
target-version = "py311"
